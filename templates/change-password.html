<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密码</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="auth-body" data-csrf="__CSRF_TOKEN__">
  <main class="auth-shell">
    <section class="auth-panel">
      <header class="auth-header"><p class="eyebrow">差旅报销系统</p><h1>修改密码</h1><p>请设置一个新的登录密码。</p></header>
      <form class="auth-form" data-auth-form data-endpoint="/api/password/change" data-change-password novalidate>
        <label for="current-password">当前密码</label>
        <input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
        <label for="new-password">新密码</label>
        <input id="new-password" name="new_password" type="password" autocomplete="new-password" required>
        <label for="confirm-password">确认新密码</label>
        <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required>
        <p class="form-message" data-message aria-live="polite"></p>
        <button type="submit">保存密码</button>
      </form>
      <script src="/static/common.js" defer></script><script src="/static/auth.js" defer></script>
    </section>
  </main>
</body>
</html>
