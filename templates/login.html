<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="auth-body" data-csrf="__CSRF_TOKEN__">
  <main class="auth-shell">
    <section class="auth-panel">
      <header class="auth-header"><p class="eyebrow">差旅报销系统</p><h1>登录</h1><p>使用已审批的账号继续。</p></header>
      <form class="auth-form" data-auth-form data-endpoint="/api/login" novalidate>
        <label for="username">账号</label>
        <input id="username" name="username" type="text" autocomplete="username" required maxlength="64">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="form-message" data-message aria-live="polite"></p>
        <button type="submit">登录</button>
      </form>
      <p class="auth-link"><a href="/register">立即注册</a></p>
      <script src="/static/common.js" defer></script><script src="/static/auth.js" defer></script>
    </section>
  </main>
</body>
</html>
