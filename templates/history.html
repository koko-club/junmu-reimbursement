<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-page-title>报销记录</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260909-account">
</head>
<body class="app-body" data-csrf="__CSRF_TOKEN__" data-scope="active" data-view="active">
  <aside id="app-sidebar" class="app-sidebar" aria-label="主导航">
    <div class="brand"><img class="brand-logo" src="/static/logo.png" alt="" aria-hidden="true"><span>君牧在线报销系统</span></div>
    <nav><a href="/"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#file-pen"></use></svg><span>填写报销</span></a><a href="/history" data-nav-active="active" data-view="active"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#history"></use></svg><span>报销记录</span></a><a href="/trash" data-nav-active="trash" data-view="trash"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons.svg#trash-2"></use></svg><span>回收站</span></a></nav>
    <div class="sidebar-account" aria-live="polite"><span>当前登录：</span><strong id="current-user">加载中</strong></div>
    <button id="logout" type="button" class="secondary">退出登录</button>
  </aside>
  <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-controls="app-sidebar" aria-expanded="false">菜单</button>
  <main class="page-shell history-page">
    <header class="page-header"><h1 data-heading><svg class="ui-icon ui-icon-title" aria-hidden="true"><use href="/static/icons.svg#history"></use></svg><span data-heading-label>报销记录</span></h1><p>查看你生成的报销文件。</p></header>
    <section class="form-section" aria-labelledby="records-heading">
      <div class="section-heading"><h2 id="records-heading">报销文件</h2><span id="record-count" aria-live="polite"></span></div>
      <div id="history-error" class="result error" role="alert" aria-live="assertive"></div>
      <div id="history-empty" class="empty-state" hidden>暂无记录</div>
      <div class="table-wrap">
        <table class="history-table" aria-describedby="records-heading">
          <colgroup class="history-colgroup"><col class="history-col-reason"><col class="history-col-date"><col class="history-col-amount"><col class="history-col-created"><col class="history-col-status"><col class="history-col-actions"></colgroup>
          <thead><tr><th>出差事由</th><th>报销日期</th><th>报销金额</th><th>生成时间</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="history-rows"></tbody>
        </table>
      </div>
    </section>
    <dialog id="purge-dialog" aria-labelledby="purge-title">
      <form method="dialog" class="dialog-form" data-purge-form>
        <h2 id="purge-title">永久删除报销记录</h2>
        <p>删除后文件将无法恢复。</p>
        <p id="purge-name" class="dialog-value"></p>
        <div class="dialog-actions"><button type="submit" value="cancel" class="secondary">取消</button><button type="submit" value="confirm" data-confirm-purge>永久删除</button></div>
      </form>
    </dialog>
  </main>
  <script src="/static/common.js?v=20260909-account" defer></script><script src="/static/history.js" defer></script>
</body>
</html>
