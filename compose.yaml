services:
  reimbursement:
    image: reimbursement-system:latest
    platform: linux/amd64
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8800
      APP_DATA_DIR: /data
      APP_SOFFICE_PATH: /usr/bin/soffice
      APP_COOKIE_SECURE: "false"
      TZ: Asia/Shanghai
    ports:
      - "8800:8800"
    volumes:
      - "${DATA_PATH:-./data}:/data"
      - "${BACKUP_PATH:-./backups}:/backups"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
